[start]
command:/usr/local/sbin/sing-boxctl start
parameters:
type:script
message:starting sing-box
description:Start sing-box

[stop]
command:/usr/local/sbin/sing-boxctl stop
parameters:
type:script
message:stopping sing-box
description:Stop sing-box

[restart]
command:/usr/local/sbin/sing-boxctl restart
parameters:
type:script
message:restarting sing-box
description:Restart sing-box

[reload]
command:/usr/local/sbin/sing-boxctl reload
parameters:
type:script
message:reloading sing-box
description:Reload sing-box configuration

[status]
command:/usr/local/sbin/sing-boxctl status
parameters:
type:script_output
message:requesting sing-box status
description:Status of sing-box

[check]
command:/usr/local/sbin/sing-boxctl check
parameters:
type:script_output
message:checking sing-box configuration
description:Validate the sing-box configuration

[enable]
command:/usr/local/sbin/sing-boxctl enable
parameters:
type:script_output
message:enabling sing-box autostart
description:Enable sing-box at boot

[disable]
command:/usr/local/sbin/sing-boxctl disable
parameters:
type:script_output
message:disabling sing-box autostart
description:Disable sing-box at boot

[version]
command:/usr/local/sbin/sing-boxctl version
parameters:
type:script_output
message:requesting sing-box version
description:Version of sing-box
