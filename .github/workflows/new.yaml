name: build-awg-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CORE_REF: v1.13.8-awg2.0          # тег ядра hoaxisr/amnezia-box
      SFA_REF: '1.13.8'                 # тег sing-box-for-android той же мажорной линии
      NDK_VER: 27.2.12479018
    steps:
      # ---------- Ядро ----------
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: hoaxisr/amnezia-box
          ref: ${{ env.CORE_REF }}
          path: core

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install NDK + SDK packages
        run: |
          sdkmanager --install "ndk;${NDK_VER}" "platforms;android-35" \
                     "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV

      # ---------- Этап 1: ядро -> libbox.aar (с AWG) ----------
      - name: Build libbox.aar
        working-directory: core
        run: |
          grep -A2 '^lib_install:' Makefile || true   # показать пин gomobile в этом теге
          make lib_install                             # ставит gomobile/gobind нужной версии (v0.1.12)
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile version                             # подтверждаем версию в логе
          gomobile bind -v -target android -androidapi 21 \
            -javapkg io.nekohasekai \
            -o "$GITHUB_WORKSPACE/libbox.aar" \
            -trimpath \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${CORE_REF#v}" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_awg" \
            ./experimental/libbox

      # ---------- Этап 2: SFA -> APK ----------
      - name: Checkout SFA
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ env.SFA_REF }}
          path: sfa
          submodules: false

      - name: Inject libbox.aar
        run: |
          mkdir -p sfa/app/libs
          cp libbox.aar sfa/app/libs/libbox.aar
          # Сверь зависимость в sfa/app/build.gradle.kts:
          #   implementation(files("libs/libbox.aar"))  ИЛИ  implementation(fileTree("libs"))
          # если там implementation(project(":libbox")) — клади aar туда, куда смотрит тот модуль

      - name: Build APK
        working-directory: sfa
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleOtherRelease --no-daemon --stacktrace
          # для быстрого теста без подписи можно: assembleOtherDebug (и пропустить шаг Sign APK)

      # ---------- Подпись ----------
      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ks.jks
          BT="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find sfa -name '*-other-release*.apk' | head -1)"
          "$BT/zipalign" -v -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks ks.jks \
            --ks-pass pass:${{ secrets.KS_PASS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --out sfa-awg.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sfa-awg
          path: sfa-awg.apk