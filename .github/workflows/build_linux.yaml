name: Build sing-box (Linux, AmneziaWG)

# Cross-compiles the amnezia-box core (cmd/sing-box) for Linux with AmneziaWG.
#
# Self-contained: the core is checked out EXPLICITLY from core_repo
# (default hoaxisr/amnezia-box), so it works regardless of which repo hosts this file.
#
# Reuses the core's own `make build`, so ldflags come from the Makefile. Build tags are
# resolved per-ref and with_awg is appended when missing — the 1.12 line hardcodes it in
# the Makefile, but the 1.14 line reads release/DEFAULT_BUILD_TAGS_OTHERS, which does
# NOT contain with_awg; without this the build silently produces the "Awg is not
# included in this build" stub. Pure-Go static build (CGO_ENABLED=0);
# naive_outbound/cronet is omitted (it would need libcronet via CGO).

on:
  workflow_dispatch:
    inputs:
      core_repo:
        description: 'amnezia-box core repo (must contain the Makefile + cmd/sing-box + include/awg.go)'
        default: 'hoaxisr/amnezia-box'
        required: true
      core_ref:
        description: 'core git ref (branch / tag / full 40-char SHA). 1.12.12-awg = stable line, awg-1.14 = 1.14.0-beta line.'
        default: '1.12.12-awg'
        required: true
      goarches:
        description: 'Comma-separated Linux architectures (amd64, arm64, arm, 386, riscv64, ...)'
        default: 'amd64,arm64'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          arches="${{ github.event.inputs.goarches || 'amd64,arm64' }}"
          json=$(printf '%s' "$arches" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -cs '{goarch: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "matrix: $json"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      CORE_REPO: ${{ github.event.inputs.core_repo || 'hoaxisr/amnezia-box' }}
      CORE_REF: ${{ github.event.inputs.core_ref || '1.12.12-awg' }}
    steps:
      - name: Resolve core ref
        id: ref
        run: |
          set -e
          # The core repo renames its AWG branch over time (main -> awg-1.14 -> ...),
          # which fails the checkout outright. Fall back to the repo's own default
          # branch instead of dying on a stale input.
          url="https://github.com/${CORE_REPO}.git"
          want="${CORE_REF}"
          if printf '%s' "$want" | grep -Eq '^[0-9a-f]{40}$'; then
            resolved="$want"                       # full SHA — ls-remote cannot list it
          elif [ -n "$want" ] && git ls-remote --exit-code "$url" "refs/heads/$want" "refs/tags/$want" >/dev/null 2>&1; then
            resolved="$want"
          else
            resolved=$(git ls-remote --symref "$url" HEAD | awk '/^ref:/{sub("refs/heads/","",$2); print $2; exit}')
            [ -n "$resolved" ] || { echo "::error::cannot resolve any ref in $url"; exit 1; }
            echo "::warning::core ref '${want}' not found in ${CORE_REPO} — using default branch '${resolved}'"
          fi
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"
          echo "core ${CORE_REPO}@${resolved}"

      - name: Checkout amnezia-box core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0          # Makefile derives VERSION from `git describe --tags`
          submodules: recursive

      - name: Sanity — this repo is the core
        run: |
          test -f Makefile && test -d cmd/sing-box && test -f include/awg.go || {
            echo "::error::core_repo '${CORE_REPO}@${{ steps.ref.outputs.ref }}' is not an AWG-enabled sing-box core"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'    # >= 1.25 required by the badlinkname / -checklinkname=0 tags
          cache-dependency-path: go.sum

      - name: Build sing-box (with AmneziaWG)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -e
          [ "$GOARCH" = "arm" ] && export GOARM=7   # 32-bit ARM -> ARMv7

          # 1.14 keeps the tag list in release/*, 1.12 hardcodes it in the Makefile.
          if [ -s release/DEFAULT_BUILD_TAGS_OTHERS ]; then
            tags=$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)
          else
            tags=$(sed -n 's/^TAGS[[:space:]]*?\{0,1\}=[[:space:]]*//p' Makefile | head -1 | tr -d '\r')
          fi
          [ -n "$tags" ] || { echo "::error::could not resolve build tags"; exit 1; }
          case ",${tags}," in
            *,with_awg,*) ;;
            *) tags="${tags},with_awg" ;;          # 1.14's OTHERS list omits it
          esac
          echo "build tags: $tags"

          # `make` derives VERSION by running read_tag@latest off the network, and that
          # helper chops the first character off a tag that does not start with "v".
          ver=$(git describe --tags --always | sed 's/^v//')
          make build TAGS="$tags" VERSION="$ver"
          test -f sing-box
          out="sing-box-${ver}-linux-${GOARCH}"
          mv sing-box "$out"
          sha256sum "$out" > "${out}.sha256"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "built $out"
          file "$out" || true

      - name: Verify AWG is compiled in
        run: |
          set -e
          if strings -n 8 "$OUT" | grep -q "Awg is not included in this build"; then
            echo "::error::AWG stub present — with_awg tag missing"; exit 1
          fi
          n=$(strings -n 6 "$OUT" | grep -ci 'amneziawg' || true)
          echo "amneziawg references: $n"
          [ "$n" -gt 0 ] || { echo "::error::no amneziawg symbols found"; exit 1; }

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-${{ matrix.goarch }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          if-no-files-found: error