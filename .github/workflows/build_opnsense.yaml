name: Build sing-box (OPNsense / FreeBSD, AmneziaWG)

# Builds the amnezia-box core (cmd/sing-box) for OPNsense 26.7.x "Xenial Xenops"
# (base: FreeBSD 15.1-RELEASE, ABI FreeBSD:15:amd64) with AmneziaWG compiled in.
#
# Self-contained: the core is checked out EXPLICITLY from core_repo
# (default hoaxisr/amnezia-box), so it works regardless of which repo hosts this file.
#
# Two jobs:
#   1) build   — cross-compiles GOOS=freebsd on ubuntu-latest via the core's own
#                `make build` (version/ldflags come from the Makefile; with_awg is
#                appended to the default tags). Pure-Go static build (CGO_ENABLED=0),
#                so cross-compiling is byte-for-byte equivalent to a native build.
#                Artifacts: raw binary + .tar.gz.
#   2) package — runs a real FreeBSD 15.1 VM and calls pkg(8) to produce a proper
#                package (rc.d script + @sample config) installable on OPNsense with
#                `pkg add ./sing-box-*.pkg`. amd64 only by default.
#
# Install on the firewall (as root):
#   pkg add ./sing-box-<ver>-freebsd-amd64.pkg
#   cp /usr/local/etc/sing-box/config.json.sample /usr/local/etc/sing-box/config.json  # if not auto-created
#   echo 'sing_box_enable=YES' > /etc/rc.conf.d/sing_box   # OPNsense regenerates /etc/rc.conf, rc.conf.d persists
#   service sing_box start
#
# Notes:
#   - naive_outbound/cronet is omitted (needs libcronet via CGO).
#   - Packages are not part of the OPNsense repo, so a major firmware upgrade may
#     remove them — re-add the .pkg afterwards.

on:
  workflow_dispatch:
    inputs:
      core_repo:
        description: 'amnezia-box core repo (must contain the Makefile + cmd/sing-box + include/awg.go)'
        default: 'hoaxisr/amnezia-box'
        required: true
      core_ref:
        description: 'core git ref (branch / tag / full 40-char SHA). Empty = the core repo default branch.'
        default: 'awg-1.14'
        required: false
      goarches:
        description: 'Comma-separated FreeBSD architectures (amd64 for OPNsense CE; arm64 also possible)'
        default: 'amd64'
        required: true
      freebsd_release:
        description: 'FreeBSD release of the packaging VM — must match the OPNsense base (26.7.x = 15.1)'
        default: '15.1'
        required: true
      make_pkg:
        description: 'Also build an installable FreeBSD package (.pkg) for amd64'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          arches="${{ github.event.inputs.goarches || 'amd64' }}"
          json=$(printf '%s' "$arches" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -cs '{goarch: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "matrix: $json"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      CORE_REPO: ${{ github.event.inputs.core_repo || 'hoaxisr/amnezia-box' }}
      CORE_REF: ${{ github.event.inputs.core_ref || 'awg-1.14' }}
    steps:
      - name: Resolve core ref
        id: ref
        run: |
          set -e
          # The core repo renames its AWG branch over time (main -> awg-1.14 -> ...),
          # which used to fail the checkout outright. Fall back to whatever the repo
          # says is its default branch instead of dying on a stale input.
          url="https://github.com/${CORE_REPO}.git"
          want="${CORE_REF}"
          if printf '%s' "$want" | grep -Eq '^[0-9a-f]{40}$'; then
            resolved="$want"                       # full SHA — ls-remote cannot list it
          elif [ -n "$want" ] && git ls-remote --exit-code "$url" "refs/heads/$want" "refs/tags/$want" >/dev/null 2>&1; then
            resolved="$want"
          else
            resolved=$(git ls-remote --symref "$url" HEAD | awk '/^ref:/{sub("refs/heads/","",$2); print $2; exit}')
            [ -n "$resolved" ] || { echo "::error::cannot resolve any ref in $url"; exit 1; }
            echo "::warning::core ref '${want}' not found in ${CORE_REPO} — using default branch '${resolved}'"
          fi
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"
          echo "building ${CORE_REPO}@${resolved}"

      - name: Checkout amnezia-box core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0          # Makefile derives VERSION from `git describe --tags`
          submodules: recursive

      - name: Sanity — this repo is the core
        run: |
          test -f Makefile && test -d cmd/sing-box || {
            echo "::error::core_repo '${CORE_REPO}@${CORE_REF}' has no Makefile/cmd/sing-box — wrong repo?"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'    # >= 1.25 required by the badlinkname / -checklinkname=0 tags
          cache-dependency-path: go.sum

      - name: Patch the direct outbound for platforms without an interface monitor
        run: |
          set -e
          # sing-tun has no NetworkUpdateMonitor outside linux/windows/darwin
          # (monitor_other.go returns os.ErrInvalid), so route.NetworkManager keeps a nil
          # interfaceMonitor. direct.Outbound.Start() calls InterfaceMonitor().MyInterfaces()
          # unconditionally, so on FreeBSD every config carrying a `direct` outbound dies at
          # startup with a SIGSEGV in fetchMyAddresses. Guard the call.
          f=protocol/direct/outbound.go
          [ -f "$f" ] || { echo "::notice::$f not present on this ref — nothing to patch"; exit 0; }
          if grep -q 'interfaceMonitor := h.network.InterfaceMonitor()' "$f"; then
            echo "already guarded upstream"
            exit 0
          fi
          if ! grep -q 'h.network.InterfaceMonitor().MyInterfaces()' "$f"; then
            echo "::notice::no unguarded InterfaceMonitor() call in $f — nothing to patch"
            exit 0
          fi
          python3 - "$f" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = "\tmyInterfaceNames := h.network.InterfaceMonitor().MyInterfaces()\n"
          new = (
              "\tif h.network == nil {\n\t\treturn\n\t}\n"
              "\tinterfaceMonitor := h.network.InterfaceMonitor()\n"
              "\tif interfaceMonitor == nil {\n"
              "\t\t// No default interface monitor on this platform (FreeBSD and friends).\n"
              "\t\treturn\n\t}\n"
              "\tmyInterfaceNames := interfaceMonitor.MyInterfaces()\n"
          )
          assert src.count(old) == 1, "unexpected source layout"
          open(path, "w").write(src.replace(old, new, 1))
          print("patched", path)
          PY
          if gofmt -l "$f" | grep -q .; then
            echo "::error::patch left $f unformatted"; gofmt -d "$f"; exit 1
          fi
          echo "PATCHED_DIRECT=1" >> "$GITHUB_ENV"

      - name: Build sing-box (with AmneziaWG)
        env:
          GOOS: freebsd
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -e
          [ "$GOARCH" = "arm" ] && export GOARM=7   # 32-bit ARM -> ARMv7

          # release/DEFAULT_BUILD_TAGS_OTHERS does NOT carry with_awg on the awg-1.14
          # branch (it did on the old main), so append it instead of trusting the file.
          tags=$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)
          case ",${tags}," in
            *,with_awg,*) ;;
            *) tags="${tags},with_awg" ;;
          esac
          echo "build tags: $tags"

          # `make` derives VERSION by running read_tag@latest off the network, and that
          # helper chops the first character off a tag that does not start with "v" —
          # 1.14.0-beta.14-awgm.10 shipped as ".14.0-beta.14-awgm.10". Pass it explicitly.
          ver=$(git describe --tags --always | sed 's/^v//')
          make build TAGS="$tags" VERSION="$ver"
          test -f sing-box
          out="sing-box-${ver}-freebsd-${GOARCH}"
          mv sing-box "$out"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "built $out"
          file "$out" || true

      - name: Verify AWG is compiled in
        run: |
          set -e
          if strings -a -n 8 "$OUT" | grep -q "Awg is not included in this build"; then
            echo "::error::AWG stub present — with_awg tag missing"; exit 1
          fi
          n=$(strings -a -n 6 "$OUT" | grep -ci 'amneziawg' || true)
          echo "amneziawg references: $n"
          [ "$n" -gt 0 ] || { echo "::error::no amneziawg symbols found"; exit 1; }

      - name: Verify the ELF really targets FreeBSD
        run: |
          set -e
          # Go stamps ELFOSABI_FREEBSD in the header for GOOS=freebsd — catches a GOOS mix-up.
          if ! { readelf -h "$OUT" | grep -qi 'freebsd' || file "$OUT" | grep -qi 'freebsd'; }; then
            echo "::error::$OUT does not look like a FreeBSD ELF"
            readelf -h "$OUT"; file "$OUT"; exit 1
          fi

      - name: Package tarball + checksum
        run: |
          set -e
          tar czf "${OUT}.tar.gz" "$OUT"
          sha256sum "$OUT" "${OUT}.tar.gz" > "${OUT}.sha256"
          cat "${OUT}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-freebsd-${{ matrix.goarch }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.tar.gz
            ${{ env.OUT }}.sha256
          if-no-files-found: error

  package:
    # OPNsense CE ships amd64 only; the .pkg job therefore targets amd64.
    needs: build
    if: ${{ github.event.inputs.make_pkg != 'false' && contains(github.event.inputs.goarches || 'amd64', 'amd64') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (service files under opnsense/)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Fetch the freebsd/amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: sing-box-freebsd-amd64
          path: dist

      - name: Stage the package tree
        run: |
          set -e
          bin=$(ls dist/sing-box-*-freebsd-amd64 | grep -v -e '\.tar\.gz$' -e '\.sha256$' | head -n1)
          test -n "$bin" || { echo "::error::binary not found in artifact"; exit 1; }
          ver=$(basename "$bin" | sed -e 's/^sing-box-//' -e 's/-freebsd-amd64$//')
          # pkg versions must not contain '-' (it separates name from version) — normalise.
          pkgver=$(printf '%s' "$ver" | tr '-' '.')
          echo "PKGVERSION=$pkgver" >> "$GITHUB_ENV"
          echo "RAWVERSION=$ver"    >> "$GITHUB_ENV"

          mkdir -p stage/usr/local/bin stage/usr/local/etc/rc.d stage/usr/local/etc/sing-box meta out
          mkdir -p stage/var/db/sing-box && chmod 0700 stage/var/db/sing-box
          install -m 0755 "$bin" stage/usr/local/bin/sing-box

          # ---- service files (kept in the repo under opnsense/) ------------
          # rc.d script, the configd action set and the sing-boxctl wrapper live as real
          # files so they can be reviewed and shell-checked outside this YAML.
          mkdir -p stage/usr/local/sbin \
                   stage/usr/local/opnsense/service/conf/actions.d
          install -m 0755 repo/opnsense/rc.d/sing_box  stage/usr/local/etc/rc.d/sing_box
          install -m 0755 repo/opnsense/sbin/sing-boxctl stage/usr/local/sbin/sing-boxctl
          install -m 0644 repo/opnsense/actions.d/actions_singbox.conf \
            stage/usr/local/opnsense/service/conf/actions.d/actions_singbox.conf

          # ---- sample config -----------------------------------------------
          # AWG is an *endpoint* type in the 1.14 core (option.AwgEndpointOptions):
          # peers[] instead of the flat 1.13 wireguard outbound, and h1..h4 are strings.
          install -m 0600 repo/opnsense/etc/config.json.sample \
            stage/usr/local/etc/sing-box/config.json.sample

          # Fail loudly here rather than shipping a package with a broken script.
          sh -n stage/usr/local/etc/rc.d/sing_box
          sh -n stage/usr/local/sbin/sing-boxctl
          python3 - <<'PY'
          import configparser
          cfg = configparser.ConfigParser(delimiters=(":",))
          cfg.read("stage/usr/local/opnsense/service/conf/actions.d/actions_singbox.conf")
          missing = {"start", "stop", "restart", "reload", "status"} - set(cfg.sections())
          assert not missing, f"configd actions missing: {missing}"
          for name in cfg.sections():
              assert cfg[name].get("command"), f"[{name}] has no command"
              assert cfg[name].get("type"), f"[{name}] has no type"
          print("configd actions:", ", ".join(sorted(cfg.sections())))
          PY

          # ---- plist (paths relative to prefix) -----------------------------
          # Only builtin keywords here: @sample lives in the ports tree
          # (/usr/ports/Keywords/sample.ucl), which the packaging VM does not have.
          # The sample-config dance is done by the scripts below instead.
          # Owners/modes are taken from the stage tree.
          cat > meta/plist <<'PLIST'
          bin/sing-box
          sbin/sing-boxctl
          etc/rc.d/sing_box
          etc/sing-box/config.json.sample
          opnsense/service/conf/actions.d/actions_singbox.conf
          @dir /var/db/sing-box
          PLIST

          # ---- install scripts (pkg picks these up from the metadata dir) ----
          cat > meta/+POST_INSTALL <<'POST'
          #!/bin/sh
          cfg=/usr/local/etc/sing-box/config.json
          if [ ! -f "${cfg}" ]; then
              cp -p "${cfg}.sample" "${cfg}"
              echo "==> ${cfg} created from the sample. Edit it, then:"
              echo "    sing-boxctl check && sing-boxctl enable && sing-boxctl start"
          fi
          # configd caches its action set at startup, so a fresh actions_singbox.conf
          # only reaches `configctl` after a restart. Absent on plain FreeBSD.
          if [ -x /usr/local/etc/rc.d/configd ]; then
              service configd restart > /dev/null 2>&1 || true
              echo "==> configctl singbox start|stop|restart|reload|status is available"
          fi
          POST

          cat > meta/+PRE_DEINSTALL <<'PRE'
          #!/bin/sh
          cfg=/usr/local/etc/sing-box/config.json
          # Stop the service before its binary goes away; leave the autostart flag in
          # /etc/rc.conf.d/sing_box alone so an upgrade does not silently disable it.
          if [ -x /usr/local/sbin/sing-boxctl ]; then
              /usr/local/sbin/sing-boxctl stop > /dev/null 2>&1 || true
          fi
          # Remove the config only while it is still an untouched copy of the sample.
          if [ -f "${cfg}" ] && cmp -s "${cfg}" "${cfg}.sample"; then
              rm -f "${cfg}"
          fi
          PRE

          # ---- manifest ------------------------------------------------------
          cat > meta/+MANIFEST <<MANIFEST
          name: sing-box
          version: "${pkgver}"
          origin: net/sing-box
          comment: "The universal proxy platform, AmneziaWG-enabled build"
          maintainer: "noreply@github.com"
          www: "https://sing-box.sagernet.org"
          prefix: "/usr/local"
          abi: "FreeBSD:15:amd64"
          arch: "freebsd:15:x86:64"
          categories: [net, security]
          licenselogic: single
          licenses: [GPLv3]
          desc: <<EOD
          sing-box built from the amnezia-box fork with the with_awg build tag, so the
          AmneziaWG (obfuscated WireGuard) endpoint and outbound types are available.

          Static pure-Go binary (CGO disabled), built for FreeBSD 15.x / OPNsense 26.7.
          Enable with:  echo 'sing_box_enable=YES' > /etc/rc.conf.d/sing_box
          EOD
          MANIFEST

          echo "--- plist ---";    cat meta/plist
          echo "--- manifest ---"; cat meta/+MANIFEST

      - name: Build .pkg in a FreeBSD ${{ github.event.inputs.freebsd_release || '15.1' }} VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ github.event.inputs.freebsd_release || '15.1' }}
          arch: x86_64
          usesh: true
          copyback: true
          envs: 'PKGVERSION RAWVERSION'
          prepare: |
            pkg --version >/dev/null 2>&1 || ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            ASSUME_ALWAYS_YES=yes pkg install -y python3
          run: |
            set -e
            pkg --version
            pkg -vv | grep -i 'ABI' || true
            pkg create -v -f tzst -m meta -p meta/plist -r stage -o out
            ls -l out

            # --- make the manifest readable by the pkg OPNsense ships -----------
            # pkg >= 2.4 writes every file as {"sum":...,"uname":...,"perm":...,"mtime":...}.
            # OPNsense 26.7 carries pkg 2.3.1, which does not know those keys: it logs
            # "Skipping unknown key for file(...): sum", loses the checksum and then dies
            # with SIGSEGV halfway through `pkg add`. The older flat layout
            # ({path: "<sum>"}, {dir: "y"}) is understood by both, and ownership/mode ride
            # along in the tar headers regardless. Rewrite in place, keeping every tar
            # header untouched so root/wheel survives.
            raw=$(ls out/sing-box-*.pkg)
            zstd -d -q -f "$raw" -o /tmp/pkg.tar
            python3 - /tmp/pkg.tar /tmp/pkg-flat.tar <<'PY'
            import io, json, sys, tarfile

            src, dst = sys.argv[1], sys.argv[2]
            changed = False
            with tarfile.open(src, "r:") as tin, tarfile.open(dst, "w:") as tout:
                for member in tin:
                    if member.name == "+MANIFEST" and member.isfile():
                        body = tin.extractfile(member).read()
                        data = json.loads(body)
                        for key, empty in (("files", None), ("directories", "y")):
                            section = data.get(key)
                            if not isinstance(section, dict):
                                continue
                            for path, value in list(section.items()):
                                if isinstance(value, dict):
                                    section[path] = empty if empty else value.get("sum", "")
                                    changed = True
                        new = json.dumps(data, separators=(",", ":")).encode()
                        member.size = len(new)
                        tout.addfile(member, io.BytesIO(new))
                    else:
                        tout.addfile(member, tin.extractfile(member) if member.isfile() else None)
            print("manifest flattened" if changed else "manifest already flat")

            with tarfile.open(dst, "r:") as check:
                manifest = json.loads(check.extractfile("+MANIFEST").read())
                for key in ("files", "directories"):
                    for path, value in (manifest.get(key) or {}).items():
                        assert isinstance(value, str) and value, f"{key}:{path} still not flat"
                assert manifest["scripts"]["post-install"], "post-install script lost"
            print("manifest verified")
            PY
            zstd -q -19 -T0 -f /tmp/pkg-flat.tar -o "$raw"
            ls -l out

            # Sanity: the package must be readable, installable and actually run.
            pkg info -F out/sing-box-*.pkg
            pkg add -f out/sing-box-*.pkg
            # +POST_INSTALL must have seeded the live config from the sample.
            test -f /usr/local/etc/sing-box/config.json
            /usr/local/bin/sing-box version
            /usr/local/bin/sing-box version | grep -qi 'with_awg' \
              || { echo "::error::with_awg missing from the version banner tags"; exit 1; }

            # Runtime proof that the awg endpoint is registered (stronger than a strings
            # grep): fill the shipped sample with real keys and let sing-box parse it.
            priv=$(/usr/local/bin/sing-box generate wg-keypair | awk '/PrivateKey/{print $2}')
            pub=$(/usr/local/bin/sing-box generate wg-keypair | awk '/PublicKey/{print $2}')
            sed -e "s#PRIVATE_KEY_BASE64#${priv}#" -e "s#PEER_PUBLIC_KEY_BASE64#${pub}#" \
              /usr/local/etc/sing-box/config.json.sample > /tmp/awg-check.json
            /usr/local/bin/sing-box check -c /tmp/awg-check.json
            echo "sample config parses and the awg endpoint is live"

            # Parsing is not enough: on FreeBSD the `direct` outbound used to panic in
            # Start() because there is no interface monitor on this platform. Actually
            # start the daemon and let it get past the outbound start stage.
            /usr/local/bin/sing-box run -c /tmp/awg-check.json > /tmp/sing-box-run.log 2>&1 &
            sbpid=$!
            sleep 5
            if ! kill -0 "$sbpid" 2>/dev/null; then
              echo "::error::sing-box died during startup"; cat /tmp/sing-box-run.log; exit 1
            fi
            kill "$sbpid" 2>/dev/null || true
            sleep 1
            if grep -qi 'panic\|SIGSEGV' /tmp/sing-box-run.log; then
              echo "::error::panic during startup"; cat /tmp/sing-box-run.log; exit 1
            fi
            if ! grep -q 'sing-box started' /tmp/sing-box-run.log; then
              echo "::error::sing-box never reported a successful start"
              cat /tmp/sing-box-run.log; exit 1
            fi
            echo "daemon starts cleanly with a direct outbound present"

            # --- the management layer -------------------------------------------
            test -x /usr/local/etc/rc.d/sing_box
            test -x /usr/local/sbin/sing-boxctl
            test -f /usr/local/opnsense/service/conf/actions.d/actions_singbox.conf

            # Point the service at the keyed config instead of the placeholder one that
            # +POST_INSTALL laid down; this also exercises the rc.conf.d override path.
            sysrc -f /etc/rc.conf.d/sing_box sing_box_config=/tmp/awg-check.json > /dev/null
            sing-boxctl config
            sing-boxctl check

            # Autostart flag round trip.
            sing-boxctl enable
            sysrc -f /etc/rc.conf.d/sing_box -n sing_box_enable | grep -qi '^yes$' \
              || { echo "::error::enable did not set sing_box_enable"; exit 1; }
            sing-boxctl status | grep -q 'autostart : enabled' \
              || { echo "::error::status does not report the autostart flag"; exit 1; }

            # Start / reload (SIGHUP, no downtime) / stop through the wrapper.
            sing-boxctl start
            sleep 4
            sing-boxctl status | grep -q 'running (pid' \
              || { echo "::error::service did not come up"; sing-boxctl status; exit 1; }
            pid_before=$(cat /var/run/sing_box.pid)
            sing-boxctl reload
            sleep 3
            pid_after=$(cat /var/run/sing_box.pid)
            [ "$pid_before" = "$pid_after" ] \
              || { echo "::error::reload restarted the process instead of SIGHUP"; exit 1; }
            sing-boxctl stop
            sleep 2
            sing-boxctl status | grep -q 'service   : stopped' \
              || { echo "::error::service did not stop"; sing-boxctl status; exit 1; }
            sing-boxctl disable
            rm -f /etc/rc.conf.d/sing_box
            echo "sing-boxctl drives the service end to end"

            service sing_box status || true          # not enabled -> non-zero exit, that is expected
            pkg delete -y sing-box
            # +PRE_DEINSTALL drops the untouched config; the sample goes with the package.
            test ! -e /usr/local/etc/sing-box/config.json
            echo "install/deinstall scripts behave"

      - name: Rename + checksum the package
        run: |
          set -e
          cd out
          pkgfile=$(ls sing-box-*.pkg 2>/dev/null || ls sing-box-*.txz)
          final="sing-box-${RAWVERSION}-freebsd-amd64.pkg"
          [ "$pkgfile" = "$final" ] || mv "$pkgfile" "$final"
          sha256sum "$final" > "${final}.sha256"
          cat "${final}.sha256"
          echo "PKGFILE=out/$final" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-opnsense-amd64-pkg
          path: |
            out/*.pkg
            out/*.sha256
          if-no-files-found: error
